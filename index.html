<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.O.O.D - Olympic Graphics Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <aside class="steps">
      <button class="step active" data-step="1">1 Format</button>
      <button class="step" data-step="2">2 Image</button>
      <button class="step" data-step="3">3 Text</button>
      <button class="step" data-step="4">4 Speaker</button>
      <button class="step" data-step="5">5 Logo</button>
      <button class="step" data-step="6">6 Footer</button>
    </aside>

    <main class="center">
      <div id="canvas" class="canvas">
        <img id="bg" alt="">
        <div id="overlay"></div>
        <div id="textBox"></div>
        <img id="mugshot" alt="">
        <div id="speaker"></div>
        <img id="logo" alt="">
        <div id="footer"></div>
      </div>
    </main>

    <aside id="panel" class="panel"></aside>

  </div>

  <script src="script.js"></script>
</body>
</html>
